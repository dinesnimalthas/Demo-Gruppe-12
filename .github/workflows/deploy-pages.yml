name: Deploy to GitHub Pages with Token

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Token into immoflow.js
        run: |
          # Ersetze PLACEHOLDER_TOKEN mit echtem Token aus Secret
          sed -i "s/PLACEHOLDER_TOKEN/${{ secrets.TOKEN_ACTIONS_2 }}/g" docs/immoflow.js
          # Deaktiviere Demo-Modus für Production
          sed -i "s/DEMO_MODE: false/DEMO_MODE: false/g" docs/immoflow.js
          echo "✅ Token injiziert in immoflow.js"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
