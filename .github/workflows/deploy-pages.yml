name: Deploy to GitHub Pages with Token

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject GitHub Token
        run: |
          echo "🔧 Injecting GitHub Token into immoflow.js..."
          sed -i "s/PLACEHOLDER_TOKEN/${{ secrets.TOKEN_ACTIONS_2 }}/g" docs/immoflow.js
          echo "✅ Token successfully injected"
          echo "📝 Token length: $(echo '${{ secrets.TOKEN_ACTIONS_2 }}' | wc -c) characters"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
