name: Label Bot

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label based on title and body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const titleAndBody = (issue.title + ' ' + (issue.body || '')).toLowerCase();
            const labels = [];

            // Bug-related keywords
            if (titleAndBody.match(/\b(bug|error|fehler|problem|crash|broken|fix)\b/)) {
              labels.push('bug');
            }

            // Feature-related keywords
            if (titleAndBody.match(/\b(feature|enhancement|verbesserung|neu|new)\b/)) {
              labels.push('enhancement');
            }

            // Documentation-related keywords
            if (titleAndBody.match(/\b(doc|documentation|dokumentation|readme|guide)\b/)) {
              labels.push('documentation');
            }

            // Question-related keywords
            if (titleAndBody.match(/\b(question|frage|help|hilfe|how to|wie)\b/)) {
              labels.push('question');
            }

            // Priority keywords
            if (titleAndBody.match(/\b(urgent|dringend|critical|kritisch|asap)\b/)) {
              labels.push('priority: high');
            }

            // Difficulty labels
            if (titleAndBody.match(/\b(easy|einfach|beginner|anfänger|good first issue)\b/)) {
              labels.push('good first issue');
            }

            // Add labels if any were identified
            if (labels.length > 0) {
              if (context.payload.issue) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labels
                });
              } else if (context.payload.pull_request) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: labels
                });
              }
              console.log(`Added labels: ${labels.join(', ')}`);
            }
