name: Auto Labeler

on:
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-by-files:
    runs-on: ubuntu-latest
    name: Label PRs by File Changes
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Auto-label PRs based on changed files
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🏷️ Auto-labeling PR based on file changes...');
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            const labels = new Set();
            
            for (const file of files) {
              const path = file.filename;
              console.log(`📄 Analyzing: ${path}`);
              
              // Documentation
              if (path.match(/\.(md|txt)$/i) || path.includes('docs/') || path.includes('documentation/')) {
                labels.add('documentation');
              }
              
              // Workflows
              if (path.includes('.github/workflows/')) {
                labels.add('workflow');
              }
              
              // Frontend
              if (path.match(/\.(html|css|js)$/i) && path.includes('docs/')) {
                labels.add('frontend');
              }
              
              // Automation
              if (path.includes('automations/')) {
                labels.add('automation');
              }
              
              // Configuration
              if (path.match(/\.(yml|yaml|json|config)$/i)) {
                labels.add('configuration');
              }
              
              // Scripts
              if (path.match(/\.(ps1|sh|bash)$/i)) {
                labels.add('scripts');
              }
            }
            
            if (labels.size > 0) {
              const labelArray = Array.from(labels);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labelArray
              });
              console.log(`✅ Added labels: ${labelArray.join(', ')}`);
            } else {
              console.log('ℹ️ No automatic labels applied');
            }
