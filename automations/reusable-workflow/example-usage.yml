    types: [opened, synchronize, reopened]
    branches: [main, develop]  # Only for specific branches

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
    with:
      # Custom thresholds
      size_xs: 10
      size_s: 50
      size_m: 200
      size_l: 500
      # Discord notifications
      enable_discord: true
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
```

**What it does:**
- ✅ Custom size thresholds
- ✅ Discord notifications enabled
- ✅ Only runs on main and develop branches
- ✅ Full feature set

