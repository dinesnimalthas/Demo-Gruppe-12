## Example 7: Strict PR Policy

**File:** `.github/workflows/pr-size-labeler.yml`

```yaml
name: Strict PR Size Policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  label-pr:
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
    with:
      # Very strict limits
      size_xs: 5
      size_s: 20
      size_m: 75
      size_l: 150
      # XL = anything over 150 lines!
      enable_discord: true
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
  
  # Block XL PRs
  check-size:
    runs-on: ubuntu-latest
    needs: label-pr
    steps:
      - name: Check PR Size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            
            if (labels.includes('size: XL')) {
              core.setFailed('❌ PR is too large (XL). Please split into smaller PRs!');
            } else {
              console.log('✅ PR size is acceptable');
            }
```

**What it does:**
- ✅ Very strict size limits
- ✅ **Blocks XL PRs from merging**
- ✅ Forces team to split large changes
- ✅ Discord alerts for violations

