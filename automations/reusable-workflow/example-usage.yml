## Example 5: Multiple Workflows Combined

**File:** `.github/workflows/pr-automation.yml`

```yaml
name: PR Automation Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Size labeler
  size-labeler:
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
    with:
      enable_discord: true
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
  
  # Your other automations
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Linter
        run: npm run lint
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: npm test
```

**What it does:**
- ✅ Size labeling
- ✅ Linting
- ✅ Testing
- ✅ All in one workflow!

