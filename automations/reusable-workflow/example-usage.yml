## Test Your Implementation

### Quick Test Script

```bash
# 1. Create test branch
git checkout -b test/pr-size-demo

# 2. Make small change (will be labeled "S")
echo "Test line 1" >> test.txt
echo "Test line 2" >> test.txt
echo "Test line 3" >> test.txt
# ... add ~30 lines total

# 3. Commit and push
git add test.txt
git commit -m "test: PR size labeler demo"
git push -u origin test/pr-size-demo

# 4. Create PR on GitHub
# Expected: Label "size: S" appears in ~30 seconds
```

