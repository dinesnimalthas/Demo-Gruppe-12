## Example 6: Enterprise Setup

**File:** `.github/workflows/pr-size-labeler.yml`

```yaml
name: Enterprise PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/*
      - hotfix/*

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    # Only run on business hours (optional)
    if: github.event.pull_request.draft == false
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
    with:
      # Enterprise thresholds
      size_xs: 20
      size_s: 100
      size_m: 300
      size_l: 750
      # Notifications
      enable_discord: true
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
```

**What it does:**
- ✅ Only runs on specific branches (main, release, hotfix)
- ✅ Skips draft PRs
- ✅ Larger thresholds for enterprise scale
- ✅ Discord integration for team awareness

