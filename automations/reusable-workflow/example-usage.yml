## Example 3: With Discord Notifications

**File:** `.github/workflows/pr-size-labeler.yml`

```yaml
name: PR Size Labeler with Discord

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
    with:
      enable_discord: true
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
```

**What it does:**
- ✅ All standard features
- ✅ Sends real-time Discord notifications
- ✅ Rich embeds with PR info
- ✅ Color-coded by size

**Setup Discord Secret:**
```bash
# Settings → Secrets and variables → Actions → New repository secret
# Name: DISCORD_WEBHOOK_URL
# Value: https://discord.com/api/webhooks/...
```

