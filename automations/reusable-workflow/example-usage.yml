## Comparing Configurations

| Configuration | XS | S | M | L | XL | Discord | Best For |
|--------------|----|----|----|----|-----|---------|----------|
| **Default** | <10 | <50 | <200 | <500 | ≥500 | ❌ | General use |
| **Strict** | <5 | <25 | <100 | <300 | ≥300 | ✅ | Fast reviews |
| **Relaxed** | <20 | <100 | <300 | <750 | ≥750 | ✅ | Large projects |
| **Enterprise** | <20 | <100 | <300 | <750 | ≥750 | ✅ | Big teams |

