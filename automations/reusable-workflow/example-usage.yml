# Example Usage of Reusable PR Size Labeler

> Copy these examples to your own repository!

---

## Example 1: Basic Usage (Recommended Start)

**File:** `.github/workflows/pr-size-labeler.yml`

```yaml
name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
```

**What it does:**
- ✅ Uses default size thresholds (XS<10, S<50, M<200, L<500, XL≥500)
- ✅ Adds size labels automatically
- ✅ Posts statistics comment
- ✅ No Discord notifications

---

## Example 2: Custom Size Thresholds

**File:** `.github/workflows/pr-size-labeler.yml`

```yaml
name: PR Size Labeler (Custom Sizes)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    uses: HSLU-Exercise/scope-your-project-gruppe-12/.github/workflows/reusable-pr-size-labeler.yml@main
    with:
      # Stricter thresholds for better code review
      size_xs: 5      # XS: < 5 lines (trivial changes)
      size_s: 25      # S: 5-24 lines (small fixes)
      size_m: 100     # M: 25-99 lines (normal PRs)
      size_l: 300     # L: 100-299 lines (large features)
                      # XL: ≥ 300 lines (needs split!)
```

**What it does:**
- ✅ Uses stricter size limits
- ✅ Encourages smaller, more focused PRs
- ✅ Good for teams with fast review cycles

